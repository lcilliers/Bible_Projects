<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 905" width="1100" height="905" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1100" height="905" fill="#fbfaf7"/>

  <text x="40" y="38" font-size="18" font-weight="bold" fill="#222">Thought: observed interrelations</text>
  <text x="40" y="58" font-size="12" fill="#555">From the 255-row Strong's dataset (226 verses)</text>
  <text x="40" y="74" font-size="12" fill="#555">Each link cites a verse from that dataset</text>

  <!-- ===== EDGES ===== -->
  <g stroke="#555" stroke-width="1.5" fill="none">
    <!-- God <-> core -->
    <line x1="550" y1="102" x2="550" y2="326" marker-start="url(#a)" marker-end="url(#a)"/>
    <!-- Opposing -> core -->
    <line x1="260" y1="182" x2="428" y2="330" marker-end="url(#a)"/>
    <!-- Counsel -> core -->
    <line x1="840" y1="182" x2="672" y2="330" marker-end="url(#a)"/>
    <!-- Night -> core -->
    <line x1="272" y1="345" x2="416" y2="372" marker-end="url(#a)"/>
    <!-- Spirit <-> core -->
    <line x1="272" y1="500" x2="416" y2="432" marker-start="url(#a)" marker-end="url(#a)"/>
    <!-- Emotion/body <-> core -->
    <line x1="828" y1="345" x2="684" y2="372" marker-start="url(#a)" marker-end="url(#a)"/>
    <!-- core -> Speech -->
    <line x1="455" y1="454" x2="255" y2="636" marker-end="url(#a)"/>
    <!-- Eyes <-> core -->
    <line x1="475" y1="696" x2="515" y2="456" marker-start="url(#a)" marker-end="url(#a)"/>
    <!-- core -> Hands/feet -->
    <line x1="600" y1="456" x2="655" y2="696" marker-end="url(#a)"/>
    <!-- Hands/feet -> Consequences -->
    <line x1="762" y1="730" x2="816" y2="690" marker-end="url(#a)"/>
    <!-- Consequences -> back to person -->
    <path d="M880,616 Q860,470 686,438" marker-end="url(#a)"/>
    <!-- God -> Consequences (overruling purpose) -->
    <polyline points="672,60 1075,60 1075,655 1054,655" marker-end="url(#a)"/>
    <!-- Speech -> Hearing -->
    <line x1="218" y1="710" x2="218" y2="748" marker-end="url(#a)"/>
    <!-- Hearing -> God -->
    <polyline points="98,790 22,790 22,16 551,16 551,26" marker-end="url(#a)"/>
    <!-- Counsel/word -> Hearing (listening or refusing) -->
    <path d="M1060,150 Q1095,150 1095,200 L1095,845 L340,845 L340,826" stroke-dasharray="4,4" marker-end="url(#a)"/>
  </g>

  <!-- ===== EDGE LABELS ===== -->
  <g font-size="11" fill="#444">
    <text x="560" y="190">↓ writes on, searches, knows</text>
    <text x="560" y="204" fill="#777">Heb 8:10 · Ps 139:2 · Isa 66:18</text>
    <text x="560" y="228">↑ turns toward</text>
    <text x="560" y="242" fill="#777">Ps 119:59 · 1 Chr 29:18</text>

    <text x="210" y="248">blinds, leads astray</text>
    <text x="210" y="262" fill="#777">2 Cor 4:4 · 11:3 · 2:11</text>

    <text x="792" y="248">gives discretion,</text>
    <text x="792" y="262">establishes plans</text>
    <text x="792" y="276" fill="#777">Prov 1:4 · 20:18 · Rom 2:15</text>

    <text x="45" y="404">thoughts come; devising on the bed</text>
    <text x="45" y="418" fill="#777">Dan 2:29 · Job 4:13 · Mic 2:1 · Ps 36:4</text>

    <text x="45" y="560">soul/spirit discerned;</text>
    <text x="45" y="574">plans perish with breath</text>
    <text x="45" y="588" fill="#777">Heb 4:12 · Ps 146:4 · 94:11</text>

    <text x="700" y="410">thoughts alarm → knees knock;</text>
    <text x="700" y="424">haste → thoughts answer</text>
    <text x="700" y="438" fill="#777">Dan 5:6 · Job 20:2 · Ps 94:19</text>

    <text x="262" y="606" text-anchor="end">tongue plots; speaking in the heart</text>
    <text x="262" y="620" text-anchor="end" fill="#777">Ps 52:2 · 35:20 · 1 Sam 1:13</text>

    <text x="470" y="610" text-anchor="end">seeing → misreckoning;</text>
    <text x="470" y="624" text-anchor="end">eyes wink plans</text>
    <text x="470" y="638" text-anchor="end" fill="#777">Gen 38:15 · Prov 16:30</text>

    <text x="640" y="600">perform it; feet run</text>
    <text x="640" y="614" fill="#777">Mic 2:1 · Isa 59:7 · Prov 6:18</text>

    <text x="895" y="556">returns on own head;</text>
    <text x="895" y="570">fruit of their devices</text>
    <text x="895" y="584" fill="#777">Esth 9:25 · Jer 6:19 · Ps 10:2</text>

    <text x="1068" y="470" text-anchor="end">purpose stands; meant it for good</text>
    <text x="1068" y="484" text-anchor="end" fill="#777">Prov 19:21 · Gen 50:20 · Job 5:12</text>
    <text x="228" y="734">spoken → heard</text>
    <text x="36" y="600" font-size="11" fill="#444" transform="rotate(-90 36 600)">heard by God: Lam 3:61 · Mal 3:16</text>
    <text x="700" y="838">do not pay attention to my words: Jer 6:19 · 18:18</text>
  </g>

  <!-- ===== NODES ===== -->
  <g font-size="13" fill="#222">
    <!-- Core -->
    <rect x="420" y="328" width="262" height="126" rx="10" fill="#e8eef7" stroke="#2f5d9a" stroke-width="2"/>
    <text x="551" y="352" text-anchor="middle" font-weight="bold">HEART / MIND</text>
    <text x="551" y="368" text-anchor="middle" font-size="11" fill="#444">lēv · dianoia · noēma (seat and source)</text>
    <line x1="440" y1="378" x2="662" y2="378" stroke="#2f5d9a" stroke-width="0.8"/>
    <text x="551" y="398" text-anchor="middle" font-weight="bold">THOUGHT</text>
    <text x="551" y="414" text-anchor="middle" font-size="11" fill="#444">arise · lodge · reckon · devise · design</text>
    <text x="551" y="430" text-anchor="middle" font-size="11" fill="#444">inner speech · reasoning · dispute</text>
    <text x="551" y="446" text-anchor="middle" font-size="10" fill="#666">H2803 · H4284 · H4209 · G1261 … (current data)</text>
  </g>

  <g font-size="13" fill="#222">
    <rect x="430" y="30" width="242" height="72" rx="10" fill="#fff" stroke="#8a6d2f" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="551" y="54" text-anchor="middle" font-weight="bold">GOD</text>
    <text x="551" y="71" text-anchor="middle" font-size="11" fill="#444">his thoughts, plans, purposes, reckoning</text>
    <text x="551" y="88" text-anchor="middle" font-size="10" fill="#666">65 verses name God/Lord · 27 knowing/searching</text>

    <rect x="40" y="110" width="250" height="72" rx="10" fill="#fff" stroke="#8a6d2f" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="165" y="134" text-anchor="middle" font-weight="bold">OPPOSING POWERS</text>
    <text x="165" y="151" text-anchor="middle" font-size="11" fill="#444">Satan · serpent · god of this world</text>
    <text x="165" y="168" text-anchor="middle" font-size="10" fill="#666">3 verses</text>

    <rect x="810" y="110" width="250" height="72" rx="10" fill="#fff" stroke="#8a6d2f" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="935" y="134" text-anchor="middle" font-weight="bold">COUNSEL · WISDOM · LAW</text>
    <text x="935" y="151" text-anchor="middle" font-size="11" fill="#444">advisers, instruction, conscience</text>
    <text x="935" y="168" text-anchor="middle" font-size="10" fill="#666">22 wisdom/counsel · 6 law/conscience</text>

    <rect x="40" y="305" width="232" height="80" rx="10" fill="#fff" stroke="#8a6d2f" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="156" y="329" text-anchor="middle" font-weight="bold">NIGHT · BED</text>
    <text x="156" y="346" text-anchor="middle" font-weight="bold">DREAMS · VISIONS</text>
    <text x="156" y="365" text-anchor="middle" font-size="10" fill="#666">6 verses</text>

    <rect x="40" y="470" width="232" height="72" rx="10" fill="#fff" stroke="#8a6d2f" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="156" y="494" text-anchor="middle" font-weight="bold">SPIRIT · SOUL · BREATH</text>
    <text x="156" y="511" text-anchor="middle" font-size="11" fill="#444">the life that holds thought</text>
    <text x="156" y="528" text-anchor="middle" font-size="10" fill="#666">4 spirit · 6 soul · 3 breath</text>

    <rect x="828" y="305" width="232" height="80" rx="10" fill="#fff" stroke="#8a6d2f" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="944" y="329" text-anchor="middle" font-weight="bold">EMOTION · BODY</text>
    <text x="944" y="346" text-anchor="middle" font-size="11" fill="#444">alarm, cares, anger, haste;</text>
    <text x="944" y="361" text-anchor="middle" font-size="11" fill="#444">limbs, knees, colour</text>
    <text x="944" y="377" text-anchor="middle" font-size="10" fill="#666">7 fear · 6 anger · body terms in Dan</text>

    <rect x="100" y="636" width="236" height="72" rx="10" fill="#fff" stroke="#8a6d2f" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="218" y="660" text-anchor="middle" font-weight="bold">SPEECH</text>
    <text x="218" y="677" text-anchor="middle" font-size="11" fill="#444">tongue · lips · mouth · words</text>
    <text x="218" y="694" text-anchor="middle" font-size="10" fill="#666">6 tongue/lips · 32 say/words</text>

    <rect x="370" y="696" width="180" height="72" rx="10" fill="#fff" stroke="#8a6d2f" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="460" y="720" text-anchor="middle" font-weight="bold">EYES · SIGHT</text>
    <text x="460" y="737" text-anchor="middle" font-size="11" fill="#444">perceiving, winking</text>
    <text x="460" y="754" text-anchor="middle" font-size="10" fill="#666">11 verses</text>

    <rect x="572" y="696" width="190" height="72" rx="10" fill="#fff" stroke="#8a6d2f" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="667" y="720" text-anchor="middle" font-weight="bold">HANDS · FEET · WAY</text>
    <text x="667" y="737" text-anchor="middle" font-size="11" fill="#444">acting, walking, turning</text>
    <text x="667" y="754" text-anchor="middle" font-size="10" fill="#666">11 hands · 19 feet/way</text>

    <rect x="818" y="620" width="236" height="72" rx="10" fill="#fff" stroke="#8a6d2f" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="936" y="644" text-anchor="middle" font-weight="bold">CONSEQUENCES</text>
    <text x="936" y="661" text-anchor="middle" font-size="11" fill="#444">fruit, return, stand, perish</text>
    <text x="936" y="678" text-anchor="middle" font-size="10" fill="#666">18 verses</text>

    <rect x="100" y="752" width="236" height="72" rx="10" fill="#fff" stroke="#8a6d2f" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="218" y="776" text-anchor="middle" font-weight="bold">HEARING</text>
    <text x="218" y="793" text-anchor="middle" font-size="11" fill="#444">heard by God; listening or refusing</text>
    <text x="218" y="810" text-anchor="middle" font-size="10" fill="#666">M41: 8 hear · 3 listen · 4 answer</text>
  </g>

  <!-- ===== LEGEND ===== -->
  <g font-size="11" fill="#444">
    <rect x="40" y="857" width="30" height="16" rx="4" fill="#e8eef7" stroke="#2f5d9a" stroke-width="2"/>
    <text x="78" y="869">Current data: the thought vocabulary (255 rows)</text>
    <rect x="400" y="857" width="30" height="16" rx="4" fill="#fff" stroke="#8a6d2f" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="438" y="869">Beyond the thought vocabulary: only seen in the verse text, not yet pulled</text>
    <text x="40" y="891" fill="#777">Counts = verses containing the ESV English word (rough screen, not verified per verse). Arrows = direction stated in the cited verses.</text>
  </g>
</svg>
